spring:
  application:
    name: ai-bi-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_bi_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-before-production-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.company.aibiplatform: DEBUG
    org.springframework.security: INFO